# This field blueprint defines a pagelist field that can be reused across multiple blueprints
# or multiple times within the same blueprint, see `/site/blueprints/pages/photography.yml` and `/site/blueprints/site.yml`
# Page lists can have different layouts and display additional information or a preview image
# More about pagelist fields: https://getkirby.com/docs/reference/panel/fields/pagelist
type: pagelist
label: Photography
parent: kirby.page("photography")
size: small
info: "{{ page.images.count }} image(s)"
layout: cards
template: album
empty: No albums yet
image:
  query: page.cover
  cover: true
  ratio: 5/4
