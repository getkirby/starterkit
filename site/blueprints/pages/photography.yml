# Each page blueprint must have a title, the title may be different from the file name
title: Photos

# Each page can have an icon that is shown in page listings when no preview image is available.
icon: 🖼

# Here we extend two pagelist fields which are defined in `/site/blueprints/fields/albums.yml`
# They differ in their page status and the label.
fields:
  drafts:
    extends: fields/albums
    label: Drafts
    status: draft

  listed:
    extends: fields/albums
    label: Published Albums
    status: listed
