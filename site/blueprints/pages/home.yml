# Each page blueprint must have a title, the title may be different from the file name
title: Home

# Each page can have an icon that is shown in page listings when no preview image is available.
icon: 🏠

# Page options allow you to control how users can interact with the page.
# Here we prevent changing the page status (the home page cannot be renamed or deleted by default)
# More about page options: https://getkirby.com/docs/reference/panel/blueprints/page#options
options:
  changeStatus: false

# Here we define a few text fields and a pagelist field (`photography`)
fields:
  headline:
    type: text
    width: 1/2
  gap:
    width: 1/2
  subheadline:
    type: text
    width: 1/2

  # The photography field extends a pagelist field defined in the `/site/blueprints/fields/albums.yml` blueprint
  # More about reusing and extending fields: https://getkirby.com/docs/guide/blueprints/extending-blueprints#reusing-and-extending-single-fields
  photography:
    label: Photography
    extends: fields/albums
    status: listed
    size: small
    help: All projects for the homepage are being pulled from the photography page.
