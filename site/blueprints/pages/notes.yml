# Each page blueprint must have a title, the title may be different from the file name
title: Notes

# Each page can have an icon that is shown in page listings when no preview image is available.
icon: 📖

# We reuse the `notes` pagelist field (defined in `/site/blueprints/fields/notes.yml`)
# three times with different page status and label
# More about pagelist fields: https://getkirby.com/docs/reference/panel/fields/pagelist
fields:
  drafts:
    extends: fields/notes
    label: Drafts
    status: draft

  unlisted:
    extends: fields/notes
    label: In Review
    status: unlisted

  listed:
    extends: fields/notes
    label: Published
    status: listed
    size: small
    layout: cards

# Define the form layout with two columns
# More about columns: https://getkirby.com/docs/guide/blueprints/layout#defining-columns
columns:
  - width: 1/3
    fields:
      - drafts
      - unlisted

  - width: 2/3
    fields:
      - listed
